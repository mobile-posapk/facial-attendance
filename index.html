<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Facial Attendance Scanner</title>


<!-- FACE API -->

<script
src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
</script>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #111827;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


header {

    background: #1f2937;

    padding: 16px;

    text-align: center;

}

header h1 {

    margin: 0;

    font-size: 20px;

}

header p {

    margin: 5px 0 0;

    font-size: 11px;

    color: #9ca3af;

}


.container {

    max-width: 1000px;

    margin: auto;

    padding: 12px;

}


/* CAMERA */

.camera {

    position: relative;

    width: 100%;

    background: black;

    border-radius: 16px;

    overflow: hidden;

}


video {

    display: block;

    width: 100%;

    height: auto;

}


canvas {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    pointer-events: none;

}


.status {

    position: absolute;

    left: 12px;

    bottom: 12px;

    padding: 8px 14px;

    border-radius: 20px;

    background:
        rgba(0,0,0,.75);

    font-size: 11px;

    font-weight: bold;

}


.status.ready {

    color: #facc15;

}


.status.scanning {

    color: #22c55e;

}


.status.detected {

    color: #38bdf8;

}


/* INFO */

.info {

    margin-top: 12px;

    padding: 16px;

    background: #1f2937;

    border-radius: 14px;

}


.info-title {

    color: #9ca3af;

    font-size: 11px;

}


.face-count {

    font-size: 28px;

    font-weight: bold;

    margin-top: 3px;

}


.message {

    color: #9ca3af;

    font-size: 12px;

    margin-top: 3px;

}


/* STUDENT RESULTS */

.results {

    margin-top: 12px;

}


.student {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 13px;

    margin-bottom: 8px;

    border-radius: 12px;

    background: #1f2937;

}


.student-icon {

    width: 48px;

    height: 48px;

    display: flex;

    justify-content: center;

    align-items: center;

    border-radius: 50%;

    background: #374151;

    font-size: 22px;

}


.student-info {

    flex: 1;

}


.student-name {

    font-size: 16px;

    font-weight: bold;

}


.student-details {

    margin-top: 3px;

    color: #9ca3af;

    font-size: 11px;

}


.match {

    font-size: 11px;

    font-weight: bold;

    color: #4ade80;

}


.unknown {

    color: #facc15;

}


/* BUTTONS */

.controls {

    display: flex;

    gap: 8px;

    margin-top: 12px;

}


button {

    flex: 1;

    padding: 14px;

    border: none;

    border-radius: 9px;

    font-weight: bold;

    cursor: pointer;

}


#start {

    background: #16a34a;

    color: white;

}


#stop {

    background: #dc2626;

    color: white;

}


#switch {

    background: #374151;

    color: white;

}


button:disabled {

    opacity: .4;

}


/* REGISTER LINK */

.register {

    display: block;

    margin-top: 12px;

    padding: 13px;

    text-align: center;

    text-decoration: none;

    color: white;

    background: #374151;

    border-radius: 9px;

    font-size: 13px;

    font-weight: bold;

}


@media(max-width:600px) {

    .container {

        padding: 8px;

    }

    .controls {

        flex-wrap: wrap;

    }

    #start {

        flex-basis: 100%;

    }

}

</style>

</head>


<body>


<header>

<h1>
FACIAL ATTENDANCE SCANNER
</h1>

<p>
AUTOMATIC STUDENT RECOGNITION
</p>

</header>


<div class="container">


<!-- CAMERA -->

<div class="camera">

<video
    id="video"
    autoplay
    muted
    playsinline
></video>


<canvas
    id="canvas"
></canvas>


<div
    id="status"
    class="status ready"
>

CAMERA OFF

</div>

</div>


<!-- INFORMATION -->

<div class="info">

<div class="info-title">

FACES DETECTED

</div>


<div
    id="faceCount"
    class="face-count"
>

0

</div>


<div
    id="message"
    class="message"
>

Start scanner to begin.

</div>

</div>


<!-- RESULTS -->

<div
    id="results"
    class="results"
></div>


<!-- CONTROLS -->

<div class="controls">


<button
    id="start"
>

▶ START SCANNER

</button>


<button
    id="stop"
    disabled
>

■ STOP

</button>


<button
    id="switch"
>

🔄 CAMERA

</button>


</div>


<a
    href="register.html"
    class="register"
>

＋ REGISTER NEW STUDENT

</a>


</div>


<script>


/************************************************
 * VARIABLES
 ************************************************/

let stream = null;

let scanning = false;

let detectionLoopRunning = false;

let facingMode = "environment";

let animationFrame = null;

let students = [];

let labeledDescriptors = [];

let faceMatcher = null;

let modelsLoaded = false;


/************************************************
 * ELEMENTS
 ************************************************/

const video =
    document.getElementById(
        "video"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const status =
    document.getElementById(
        "status"
    );


const faceCount =
    document.getElementById(
        "faceCount"
    );


const message =
    document.getElementById(
        "message"
    );


const results =
    document.getElementById(
        "results"
    );


const startButton =
    document.getElementById(
        "start"
    );


const stopButton =
    document.getElementById(
        "stop"
    );


const switchButton =
    document.getElementById(
        "switch"
    );


/************************************************
 * LOAD MODELS
 ************************************************/

async function loadModels() {

    status.textContent =
        "LOADING AI...";


    message.textContent =
        "Loading facial recognition model...";


    try {

        const MODEL_URL =
            "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";


        await faceapi.nets.tinyFaceDetector.loadFromUri(
            MODEL_URL
        );


        await faceapi.nets.faceLandmark68Net.loadFromUri(
            MODEL_URL
        );


        await faceapi.nets.faceRecognitionNet.loadFromUri(
            MODEL_URL
        );


        modelsLoaded = true;


        status.textContent =
            "READY";


        status.className =
            "status ready";


        message.textContent =
            "AI model loaded successfully.";


        loadRegisteredStudents();


    }

    catch(error) {

        console.error(error);


        status.textContent =
            "AI ERROR";


        message.textContent =
            "Unable to load recognition model.";

    }

}


/************************************************
 * LOAD REGISTERED STUDENTS
 ************************************************/

function loadRegisteredStudents() {

    students =
        JSON.parse(
            localStorage.getItem(
                "registeredStudents"
            ) || "[]"
        );


    console.log(
        "Registered students:",
        students.length
    );


    if(
        students.length === 0
    ) {

        message.textContent =
            "No students registered yet.";

        return;

    }


    labeledDescriptors = [];


    students.forEach(
        function(student) {

            if(
                !student.faceDescriptor ||
                !Array.isArray(
                    student.faceDescriptor
                )
            ) {

                return;

            }


            const descriptor =
                new Float32Array(
                    student.faceDescriptor
                );


            labeledDescriptors.push(

                new faceapi.LabeledFaceDescriptors(

                    student.lrn,

                    [descriptor]

                )

            );

        }
    );


    if(
        labeledDescriptors.length > 0
    ) {

        /*
         * 0.55 is the recognition
         * distance threshold.
         *
         * Lower = stricter.
         */

        faceMatcher =
            new faceapi.FaceMatcher(
                labeledDescriptors,
                0.55
            );

    }


    message.textContent =
        students.length +
        " student(s) registered.";

}


/************************************************
 * START CAMERA
 ************************************************/

async function startScanner() {

    try {

        stopScanner();


        if(!modelsLoaded) {

            await loadModels();

        }


        if(!modelsLoaded) {

            return;

        }


        status.textContent =
            "REQUESTING CAMERA...";


        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {

                            ideal:
                                facingMode

                        },

                        width: {

                            ideal:
                                1280

                        },

                        height: {

                            ideal:
                                720

                        }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        scanning = true;


        status.textContent =
            "SCANNING";

        status.className =
            "status scanning";


        message.textContent =
            "Looking for students...";


        startButton.disabled =
            true;


        stopButton.disabled =
            false;


        detectionLoop();


    }

    catch(error) {

        console.error(error);


        status.textContent =
            "CAMERA ERROR";


        message.textContent =
            error.name +
            ": " +
            error.message;

    }

}


/************************************************
 * DETECTION LOOP
 ************************************************/

async function detectionLoop() {

    if(!scanning) {

        detectionLoopRunning =
            false;

        return;

    }


    if(detectionLoopRunning) {

        return;

    }


    detectionLoopRunning = true;


    try {

        if(
            video.readyState >= 2 &&
            video.videoWidth > 0
        ) {

            const detections =
                await faceapi
                    .detectAllFaces(

                        video,

                        new faceapi
                            .TinyFaceDetectorOptions({

                                inputSize: 320,

                                scoreThreshold: 0.5

                            })

                    )
                    .withFaceLandmarks()
                    .withFaceDescriptors();


            drawResults(
                detections
            );


            recognizeStudents(
                detections
            );

        }

    }

    catch(error) {

        console.error(
            "Detection error:",
            error
        );

    }


    detectionLoopRunning =
        false;


    if(scanning) {

        animationFrame =
            requestAnimationFrame(
                detectionLoop
            );

    }

}


/************************************************
 * DRAW RESULTS
 ************************************************/

function drawResults(
    detections
) {

    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    faceCount.textContent =
        detections.length;


    if(
        detections.length === 0
    ) {

        status.textContent =
            "SCANNING";

        status.className =
            "status scanning";

        return;

    }


    status.textContent =
        detections.length +
        " FACE" +
        (
            detections.length > 1
            ? "S"
            : ""
        ) +
        " DETECTED";


    status.className =
        "status detected";


    detections.forEach(
        function(detection) {

            const box =
                detection.detection.box;


            const x =
                box.x;

            const y =
                box.y;

            const width =
                box.width;

            const height =
                box.height;


            ctx.strokeStyle =
                "#22c55e";


            ctx.lineWidth =
                4;


            ctx.strokeRect(
                x,
                y,
                width,
                height
            );

        }
    );

}


/************************************************
 * RECOGNIZE STUDENTS
 ************************************************/

function recognizeStudents(
    detections
) {

    results.innerHTML = "";


    if(
        detections.length === 0
    ) {

        message.textContent =
            "Looking for students...";

        return;

    }


    detections.forEach(
        function(detection) {


            let bestMatch = null;


            if(faceMatcher) {

                bestMatch =
                    faceMatcher.findBestMatch(
                        detection.descriptor
                    );

            }


            if(
                !bestMatch ||
                bestMatch.label ===
                "unknown"
            ) {

                showUnknown();

                return;

            }


            const student =
                students.find(
                    function(s) {

                        return String(s.lrn) ===
                            String(bestMatch.label);

                    }
                );


            if(!student) {

                showUnknown();

                return;

            }


            const distance =
                bestMatch.distance;


            /*
             * Convert distance to an
             * approximate similarity.
             */

            let similarity =
                Math.max(
                    0,
                    Math.min(
                        100,
                        Math.round(
                            (1 - distance) *
                            100
                        )
                    )
                );


            showStudent(
                student,
                similarity
            );

        }
    );

}


/************************************************
 * SHOW STUDENT
 ************************************************/

function showStudent(
    student,
    similarity
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "student";


    div.innerHTML = `

        <div class="student-icon">
            👤
        </div>

        <div class="student-info">

            <div class="student-name">
                ${escapeHTML(student.name)}
            </div>

            <div class="student-details">

                LRN: ${escapeHTML(student.lrn)}
                <br>

                Grade ${escapeHTML(student.grade)}
                -
                ${escapeHTML(student.section)}

            </div>

        </div>

        <div class="match">

            ✓ ${similarity}%

        </div>

    `;


    results.appendChild(
        div
    );


    message.textContent =
        "Student recognized.";

}


/************************************************
 * SHOW UNKNOWN
 ************************************************/

function showUnknown() {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "student";


    div.innerHTML = `

        <div class="student-icon">
            ❓
        </div>

        <div class="student-info">

            <div class="student-name">
                UNKNOWN
            </div>

            <div class="student-details unknown">

                Student not registered.

            </div>

        </div>

    `;


    results.appendChild(
        div
    );

}


/************************************************
 * STOP SCANNER
 ************************************************/

function stopScanner() {

    scanning = false;


    detectionLoopRunning =
        false;


    if(animationFrame) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;

    }


    if(stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    stream = null;


    video.srcObject =
        null;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    status.textContent =
        "CAMERA OFF";


    status.className =
        "status ready";


    faceCount.textContent =
        "0";


    message.textContent =
        "Start scanner to begin.";


    results.innerHTML =
        "";


    startButton.disabled =
        false;


    stopButton.disabled =
        true;

}


/************************************************
 * SWITCH CAMERA
 ************************************************/

async function switchCamera() {

    if(
        facingMode ===
        "environment"
    ) {

        facingMode =
            "user";

    }

    else {

        facingMode =
            "environment";

    }


    if(scanning) {

        await startScanner();

    }

}


/************************************************
 * HTML SAFETY
 ************************************************/

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/************************************************
 * EVENTS
 ************************************************/

startButton.addEventListener(
    "click",
    startScanner
);


stopButton.addEventListener(
    "click",
    stopScanner
);


switchButton.addEventListener(
    "click",
    switchCamera
);


/************************************************
 * INITIALIZE
 ************************************************/

loadModels();

</script>

</body>

</html>
