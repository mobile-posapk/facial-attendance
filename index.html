<script>


/************************************************
 * CONFIGURATION
 ************************************************/


/*
 * SAME GOOGLE APPS SCRIPT WEB APP
 * USED BY register.html
 */

const API_URL =
    "https://script.google.com/macros/s/AKfycbwZfRqoHRzdQrRbISRQFtBLtIiYg-E82_bzgL1oAY2oMjAKjHTMYcnU0Z5t_YVje9-2Cw/exec";



/************************************************
 * VARIABLES
 ************************************************/


let stream = null;

let scanning = false;

let detectionLoopRunning = false;

let facingMode = "environment";

let animationFrame = null;

let students = [];

let labeledDescriptors = [];

let faceMatcher = null;

let modelsLoaded = false;



/************************************************
 * ELEMENTS
 ************************************************/


const video =
    document.getElementById(
        "video"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const status =
    document.getElementById(
        "status"
    );


const faceCount =
    document.getElementById(
        "faceCount"
    );


const message =
    document.getElementById(
        "message"
    );


const results =
    document.getElementById(
        "results"
    );


const startButton =
    document.getElementById(
        "start"
    );


const stopButton =
    document.getElementById(
        "stop"
    );


const switchButton =
    document.getElementById(
        "switch"
    );



/************************************************
 * LOAD MODELS
 ************************************************/


async function loadModels() {

    status.textContent =
        "LOADING AI...";


    message.textContent =
        "Loading facial recognition model...";


    try {

        const MODEL_URL =
            "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";


        await faceapi.nets.tinyFaceDetector.loadFromUri(
            MODEL_URL
        );


        await faceapi.nets.faceLandmark68Net.loadFromUri(
            MODEL_URL
        );


        await faceapi.nets.faceRecognitionNet.loadFromUri(
            MODEL_URL
        );


        modelsLoaded = true;


        status.textContent =
            "READY";


        status.className =
            "status ready";


        message.textContent =
            "Facial recognition ready. Loading students...";


        /*
         * LOAD STUDENTS FROM GOOGLE SHEETS
         */

        await loadRegisteredStudents();

    }


    catch(error) {

        console.error(error);


        status.textContent =
            "AI ERROR";


        message.textContent =
            "Unable to load recognition model.";

    }

}



/************************************************
 * LOAD REGISTERED STUDENTS
 *
 * NO LOCALSTORAGE
 *
 * DATA COMES FROM GOOGLE SHEETS
 ************************************************/


async function loadRegisteredStudents() {

    try {

        message.textContent =
            "Loading students from Google Sheets...";


        /*
         * REQUEST STUDENTS FROM APPS SCRIPT
         */

        const response =
            await fetch(

                API_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "getStudents"

                        })

                }

            );


        if(
            !response.ok
        ) {

            throw new Error(
                "Server returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Google Sheets student response:",
            data
        );


        /*
         * CHECK RESPONSE
         */

        if(
            !data.success
        ) {

            throw new Error(

                data.message ||
                "Unable to load students."

            );

        }


        /*
         * GET STUDENTS
         */

        students =
            Array.isArray(data.students)
            ? data.students
            : [];


        console.log(
            "Students loaded:",
            students.length
        );


        /*
         * NO STUDENTS
         */

        if(
            students.length === 0
        ) {

            labeledDescriptors = [];

            faceMatcher = null;


            message.textContent =
                "No students registered in Google Sheets.";


            return;

        }


        /*
         * RESET DESCRIPTORS
         */

        labeledDescriptors = [];


        /*
         * BUILD FACE DESCRIPTORS
         */

        students.forEach(

            function(student) {


                /*
                 * SUPPORT BOTH
                 *
                 * faceDescriptor
                 *
                 * AND
                 *
                 * faceDescriptors
                 */

                let descriptors =
                    student.faceDescriptors ||
                    student.faceDescriptor;


                /*
                 * IF STRING, PARSE JSON
                 */

                if(
                    typeof descriptors ===
                    "string"
                ) {

                    try {

                        descriptors =
                            JSON.parse(
                                descriptors
                            );

                    }

                    catch(error) {

                        console.warn(
                            "Invalid descriptor for:",
                            student.lrn
                        );

                        return;

                    }

                }


                /*
                 * SINGLE DESCRIPTOR
                 */

                if(
                    Array.isArray(descriptors) &&
                    descriptors.length > 0 &&
                    typeof descriptors[0] === "number"
                ) {

                    descriptors = [
                        descriptors
                    ];

                }


                /*
                 * NO VALID DESCRIPTOR
                 */

                if(
                    !Array.isArray(descriptors) ||
                    descriptors.length === 0
                ) {

                    return;

                }


                /*
                 * CONVERT EACH DESCRIPTOR
                 */

                const descriptorArrays =
                    descriptors
                        .filter(
                            descriptor =>
                                Array.isArray(
                                    descriptor
                                ) &&
                                descriptor.length > 0
                        )
                        .map(

                            descriptor =>
                                new Float32Array(
                                    descriptor
                                )

                        );


                if(
                    descriptorArrays.length === 0
                ) {

                    return;

                }


                /*
                 * ADD TO FACE MATCHER
                 */

                labeledDescriptors.push(

                    new faceapi.LabeledFaceDescriptors(

                        String(
                            student.lrn
                        ),

                        descriptorArrays

                    )

                );

            }

        );


        /*
         * CREATE FACE MATCHER
         */

        if(
            labeledDescriptors.length > 0
        ) {

            faceMatcher =
                new faceapi.FaceMatcher(

                    labeledDescriptors,

                    0.55

                );

        }

        else {

            faceMatcher =
                null;

        }


        /*
         * SHOW REAL DATABASE COUNT
         */

        message.textContent =

            students.length +

            " student(s) registered in Google Sheets.";

    }


    catch(error) {

        console.error(
            "Student loading error:",
            error
        );


        students = [];

        labeledDescriptors = [];

        faceMatcher = null;


        message.textContent =

            "Unable to load students from Google Sheets.";

    }

}



/************************************************
 * START CAMERA
 ************************************************/


async function startScanner() {

    try {

        stopScanner();


        if(
            !modelsLoaded
        ) {

            await loadModels();

        }


        if(
            !modelsLoaded
        ) {

            return;

        }


        /*
         * MAKE SURE STUDENT DATABASE
         * IS AVAILABLE
         */

        if(
            students.length === 0
        ) {

            await loadRegisteredStudents();

        }


        status.textContent =
            "REQUESTING CAMERA...";


        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {

                            ideal:
                                facingMode

                        },

                        width: {

                            ideal:
                                1280

                        },

                        height: {

                            ideal:
                                720

                        }

                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        scanning = true;


        status.textContent =
            "SCANNING";


        status.className =
            "status scanning";


        message.textContent =
            "Looking for students...";


        startButton.disabled =
            true;


        stopButton.disabled =
            false;


        detectionLoop();

    }


    catch(error) {

        console.error(error);


        status.textContent =
            "CAMERA ERROR";


        message.textContent =
            error.name +
            ": " +
            error.message;

    }

}



/************************************************
 * DETECTION LOOP
 ************************************************/


async function detectionLoop() {

    if(
        !scanning
    ) {

        detectionLoopRunning =
            false;

        return;

    }


    if(
        detectionLoopRunning
    ) {

        return;

    }


    detectionLoopRunning =
        true;


    try {

        if(

            video.readyState >= 2 &&

            video.videoWidth > 0

        ) {


            const detections =

                await faceapi

                    .detectAllFaces(

                        video,

                        new faceapi
                            .TinyFaceDetectorOptions({

                                inputSize:
                                    320,

                                scoreThreshold:
                                    0.5

                            })

                    )

                    .withFaceLandmarks()

                    .withFaceDescriptors();


            drawResults(
                detections
            );


            recognizeStudents(
                detections
            );

        }

    }


    catch(error) {

        console.error(
            "Detection error:",
            error
        );

    }


    detectionLoopRunning =
        false;


    if(
        scanning
    ) {

        animationFrame =
            requestAnimationFrame(
                detectionLoop
            );

    }

}



/************************************************
 * DRAW RESULTS
 ************************************************/


function drawResults(
    detections
) {

    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    faceCount.textContent =
        detections.length;


    if(
        detections.length === 0
    ) {

        status.textContent =
            "SCANNING";


        status.className =
            "status scanning";


        return;

    }


    status.textContent =

        detections.length +

        " FACE" +

        (

            detections.length > 1
            ? "S"
            : ""

        ) +

        " DETECTED";


    status.className =
        "status detected";


    detections.forEach(

        function(detection) {

            const box =
                detection.detection.box;


            const x =
                box.x;


            const y =
                box.y;


            const width =
                box.width;


            const height =
                box.height;


            ctx.strokeStyle =
                "#22c55e";


            ctx.lineWidth =
                4;


            ctx.strokeRect(

                x,
                y,

                width,
                height

            );

        }

    );

}



/************************************************
 * RECOGNIZE STUDENTS
 ************************************************/

function recognizeStudents(detections) {

    const now = Date.now();


    /*
     * Keep track of students detected
     * during this camera frame.
     */

    const detectedLRNs = new Set();


    detections.forEach(function(detection) {

        let bestMatch = null;


        /*
         * FACE MATCHING
         */

        if (faceMatcher) {

            bestMatch =
                faceMatcher.findBestMatch(
                    detection.descriptor
                );

        }


        /*
         * UNKNOWN FACE
         */

        if (
            !bestMatch ||
            bestMatch.label === "unknown"
        ) {

            return;

        }


        /*
         * FIND STUDENT
         */

        const student =
            students.find(function(s) {

                return String(s.lrn).trim() ===
                       String(bestMatch.label).trim();

            });


        if (!student) {

            return;

        }


        const lrn =
            String(student.lrn).trim();


        detectedLRNs.add(lrn);


        /*
         * GET CURRENT FACE STATE
         */

        let faceState =
            activeFaces.get(lrn);


        if (!faceState) {

            faceState = {

                count: 0,

                lastSeen: now,

                student: student,

                processing: false

            };

        }


        /*
         * UPDATE FACE STATE
         */

        faceState.count++;

        faceState.lastSeen = now;

        faceState.student = student;


        activeFaces.set(
            lrn,
            faceState
        );


        /*
         * WAIT UNTIL FACE IS STABLE
         *
         * This helps prevent false
         * recognition from a single frame.
         */

        if (
            faceState.count <
            requiredStableDetections
        ) {

            return;

        }


        /*
         * ALREADY BEING PROCESSED
         */

        if (
            faceState.processing
        ) {

            return;

        }


        /*
         * STUDENT ALREADY LOCKED
         */

        if (
            attendanceLocks.has(lrn)
        ) {

            return;

        }


        /*
         * MARK AS PROCESSING
         */

        faceState.processing =
            true;


        activeFaces.set(
            lrn,
            faceState
        );


        /*
         * MATCH SCORE
         */

        const distance =
            bestMatch.distance;


        const similarity =

            Math.max(

                0,

                Math.min(

                    100,

                    Math.round(
                        (1 - distance) * 100
                    )

                )

            );


        /*
         * SHOW STUDENT
         */

        showStudent(
            student,
            similarity
        );

    });


    /*
     * REMOVE STUDENTS WHO HAVE
     * LEFT THE CAMERA VIEW
     */

    activeFaces.forEach(
        function(faceState, lrn) {

            if (
                !detectedLRNs.has(lrn)
            ) {

                if (
                    now -
                    faceState.lastSeen
                    >
                    faceGoneTimeout
                ) {

                    activeFaces.delete(lrn);

                }

            }

        }
    );

}

/************************************************
 * SHOW STUDENT
 ************************************************/


function showStudent(
    student,
    similarity
) {

    const lrn =
        String(student.lrn).trim();


    /*
     * Don't display the same student
     * again while attendance is locked.
     */

    if (
        attendanceLocks.has(lrn)
    ) {

        return;

    }


    results.innerHTML = "";


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "student";


    div.innerHTML = `

        <div class="student-icon">
            👤
        </div>

        <div class="student-info">

            <div class="student-name">
                ${escapeHTML(student.name)}
            </div>

            <div class="student-details">

                LRN:
                ${escapeHTML(student.lrn)}

                <br>

                Grade:
                ${escapeHTML(student.grade)}

                -
                ${escapeHTML(student.section)}

            </div>

        </div>

        <div class="match">

            ✓ ${similarity}%

        </div>

    `;


    results.appendChild(
        div
    );


    message.textContent =
        "Student recognized.";


    /*
     * RECORD ATTENDANCE
     */

    recordStudentAttendance(
        student
    );

}

    /*
     * If this student is already being processed,
     * don't redraw the normal student card.
     *
     * This allows the PRESENT confirmation
     * to remain visible.
     */

    const lrn =
        String(student.lrn).trim();


    if (
        attendanceLocks.has(lrn)
    ) {

        return;

    }


    results.innerHTML = "";


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "student";


    div.innerHTML = `

        <div class="student-icon">
            👤
        </div>

        <div class="student-info">

            <div class="student-name">
                ${escapeHTML(student.name)}
            </div>

            <div class="student-details">

                LRN:
                ${escapeHTML(student.lrn)}

                <br>

                Grade:
                ${escapeHTML(student.grade)}

                -
                ${escapeHTML(student.section)}

            </div>

        </div>

        <div class="match">

            ✓ ${similarity}%

        </div>

    `;


    results.appendChild(
        div
    );


    message.textContent =
        "Student recognized.";


    /*
     * RECORD ATTENDANCE
     */

    recordStudentAttendance(student);

}

/************************************************
 * RECORD STUDENT ATTENDANCE
 ************************************************/
/************************************************
 * AUTOMATIC LINE SCANNING
 * ATTENDANCE RECORDING
 ************************************************/

const attendanceLocks = new Set();

    // Students currently visible/being processed
const activeFaces = new Map();

// How long a face must disappear before
// the system considers that student gone
const faceGoneTimeout = 1500;

// Minimum number of consecutive detections
// before recognizing a student
const requiredStableDetections = 2;

const recognitionCooldown = 3000;


/************************************************
 * RECORD STUDENT ATTENDANCE
 ************************************************/

async function recordStudentAttendance(student) {

    const lrn =
        String(student.lrn).trim();


    /*
     * STUDENT IS ALREADY BEING PROCESSED
     */

    if (
        attendanceLocks.has(lrn)
    ) {

        return;

    }


    /*
     * LOCK STUDENT IMMEDIATELY
     *
     * This prevents multiple requests
     * while the face remains in front
     * of the camera.
     */

    attendanceLocks.add(lrn);


    /*
     * VISUAL CONFIRMATION
     */

    showAttendanceConfirmation(
        student,
        "RECORDING..."
    );


    try {

        const response =
            await fetch(

                API_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "recordAttendance",

                            lrn:
                                student.lrn,

                            name:
                                student.name,

                            grade:
                                student.grade,

                            section:
                                student.section

                        })

                }

            );


        const data =
            await response.json();


        console.log(
            "Attendance response:",
            data
        );


        /*
         * SUCCESS
         */

        if (
            data.success
        ) {

            if (
                data.duplicate
            ) {

                showAttendanceConfirmation(

                    student,

                    "ALREADY PRESENT"

                );

            }

            else {

                showAttendanceConfirmation(

                    student,

                    "✓ PRESENT"

                );

            }

        }


        else {

            showAttendanceConfirmation(

                student,

                "ATTENDANCE ERROR"

            );


            console.error(
                data.message
            );

        }

    }


    catch(error) {

        console.error(
            "Attendance error:",
            error
        );


        showAttendanceConfirmation(

            student,

            "CONNECTION ERROR"

        );

    }


    /*
     * KEEP STUDENT LOCKED FOR A FEW SECONDS
     *
     * This allows the student to move
     * through the camera without creating
     * repeated attendance events.
     */

    setTimeout(

        function() {

            attendanceLocks.delete(lrn);

        },

        recognitionCooldown

    );

}



/************************************************
 * ATTENDANCE CONFIRMATION
 ************************************************/

function showAttendanceConfirmation(
    student,
    statusText
) {

    results.innerHTML = "";


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "student";


    div.innerHTML = `

        <div class="student-icon">
            ${statusText === "✓ PRESENT"
                ? "✓"
                : "👤"}
        </div>

        <div class="student-info">

            <div class="student-name">
                ${escapeHTML(student.name)}
            </div>

            <div class="student-details">

                LRN:
                ${escapeHTML(student.lrn)}

                <br>

                Grade:
                ${escapeHTML(student.grade)}

                -
                ${escapeHTML(student.section)}

            </div>

        </div>

        <div class="match">

            ${escapeHTML(statusText)}

        </div>

    `;


    results.appendChild(
        div
    );


    message.textContent =
        student.name +
        " — " +
        statusText;

}
/************************************************
 * SHOW UNKNOWN
 ************************************************/


function showUnknown() {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "student";


    div.innerHTML = `

        <div class="student-icon">
            ❓
        </div>

        <div class="student-info">

            <div class="student-name">
                UNKNOWN
            </div>

            <div class="student-details unknown">

                Student not registered.

            </div>

        </div>

    `;


    results.appendChild(
        div
    );

}



/************************************************
 * STOP SCANNER
 ************************************************/


function stopScanner() {

    scanning =
        false;


    detectionLoopRunning =
        false;


    if(
        animationFrame
    ) {

        cancelAnimationFrame(
            animationFrame
        );


        animationFrame =
            null;

    }


    if(
        stream
    ) {

        stream

            .getTracks()

            .forEach(

                track =>
                    track.stop()

            );

    }


    stream =
        null;


    video.srcObject =
        null;


    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    status.textContent =
        "CAMERA OFF";


    status.className =
        "status ready";


    faceCount.textContent =
        "0";


    message.textContent =
        students.length +

        " student(s) registered in Google Sheets.";


    results.innerHTML =
        "";


    startButton.disabled =
        false;


    stopButton.disabled =
        true;

}



/************************************************
 * SWITCH CAMERA
 ************************************************/


async function switchCamera() {

    if(

        facingMode ===
        "environment"

    ) {

        facingMode =
            "user";

    }

    else {

        facingMode =
            "environment";

    }


    if(
        scanning
    ) {

        await startScanner();

    }

}



/************************************************
 * HTML SAFETY
 ************************************************/


function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/************************************************
 * EVENTS
 ************************************************/


startButton.addEventListener(

    "click",

    startScanner

);


stopButton.addEventListener(

    "click",

    stopScanner

);


switchButton.addEventListener(

    "click",

    switchCamera

);



/************************************************
 * INITIALIZE
 ************************************************/


loadModels();


</script>


</body>

</html>
