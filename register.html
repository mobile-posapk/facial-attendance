<style>

<body>


<header>

<h1>
STUDENT FACE REGISTRATION
</h1>

<p>
REGISTER STUDENT FACIAL ID
</p>

</header>


<div class="container">


<!-- ==========================================
     STUDENT INFORMATION
========================================== -->

<div class="card">

<h2>
Student Information
</h2>


<div class="form-group">

<label>
LRN
</label>

    id="lrn"

>

STUDENT NAME

    type="text"
    placeholder="Enter complete name"
>


</div>


<div class="form-group">

<label>
GRADE
</label>

<input
    id="grade"
    type="text"
    placeholder="Example: 9"
>


</div>

<label>
SECTION
</label>

<input
    id="section"
    type="text"
    placeholder="Example: Rizal"
>


</div>


</div>

     CAMERA
========================================== -->

<div class="card">

<h2>
Face Capture
</h2>


<div class="camera">

    id="video"

    muted

></video>

></canvas>

>
CAMERA OFF

>
📸 CAPTURE SAMPLE

>
🔄 SWITCH CAMERA
</button>

Waiting for camera...

</div>

>

Face Samples:
<strong>0 / 5</strong>

<!-- ==========================================
     SAVE
========================================== -->

<div class="card">

<button
    id="saveStudent"
    disabled
>

💾 SAVE STUDENT

</button>

</div>


</div>



<script>


/* ==========================================
   GOOGLE APPS SCRIPT API
========================================== */


/*
 * IMPORTANT:
 *
 * Replace this URL with your deployed
 * Google Apps Script Web App URL.
 */

const API_URL =
    "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";



/* ==========================================
   VARIABLES
========================================== */

let stream = null;

let faceDescriptors = [];

let modelsLoaded = false;


/*
 * FRONT CAMERA IS DEFAULT
 */

let facingMode = "user";



/* ==========================================
   ELEMENTS
========================================== */

const video =
    document.getElementById(
        "video"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const cameraStatus =
    document.getElementById(
        "cameraStatus"
    );


const result =
    document.getElementById(
        "result"
    );


const startCamera =
    document.getElementById(
        "startCamera"
    );


const captureFace =
    document.getElementById(
        "captureFace"
    );


const saveStudent =
    document.getElementById(
        "saveStudent"
    );



/* ==========================================
   LOAD FACE MODELS
========================================== */

async function loadModels() {

    result.textContent =
        "Loading facial recognition models...";


    try {

        const MODEL_URL =
            "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";


        await faceapi.nets.tinyFaceDetector.loadFromUri(
            MODEL_URL
        );


        await faceapi.nets.faceLandmark68Net.loadFromUri(
            MODEL_URL
        );


        await faceapi.nets.faceRecognitionNet.loadFromUri(
            MODEL_URL
        );


        modelsLoaded = true;


        result.innerHTML =
            '<span class="success">' +
            '✓ Facial recognition model ready.' +
            '</span>';

    }


    catch(error) {

        console.error(error);


        result.innerHTML =
            '<span class="error">' +
            'Unable to load facial recognition model.' +
            '</span>';

    }

}



/* ==========================================
   START CAMERA
========================================== */

async function startCameraFunction() {

    try {

        if (!modelsLoaded) {

            result.textContent =
                "Please wait for the recognition model to load.";

            return;

        }


        /*
         * STOP PREVIOUS CAMERA
         */

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        result.textContent =
            "Starting camera...";


        /*
         * CAMERA
         */

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: {

                        ideal:
                            facingMode

                    },

                    width: {

                        ideal:
                            1280

                    },

                    height: {

                        ideal:
                            720

                    }

                },

                audio: false

            });


        video.srcObject =
            stream;


        await video.play();


        /*
         * STATUS
         */

        if (
            facingMode === "user"
        ) {

            cameraStatus.textContent =
                "FRONT CAMERA";

        }

        else {

            cameraStatus.textContent =
                "REAR CAMERA";

        }


        captureFace.disabled =
            false;


        result.textContent =
            "Position the student's face inside the camera.";

    }


    catch(error) {

        console.error(error);


        cameraStatus.textContent =
            "CAMERA ERROR";


        result.innerHTML =
            '<span class="error">' +
            error.name +
            ': ' +
            error.message +
            '</span>';

    }

}



/* ==========================================
   SWITCH CAMERA
========================================== */

async function switchCameraFunction() {

    /*
     * CHANGE CAMERA
     */

    if (
        facingMode === "user"
    ) {

        facingMode =
            "environment";

    }

    else {

        facingMode =
            "user";

    }


    /*
     * RESTART CAMERA
     */

    if (stream) {

        await startCameraFunction();

    }

    else {

        if (
            facingMode === "user"
        ) {

            cameraStatus.textContent =
                "FRONT CAMERA";

        }

        else {

            cameraStatus.textContent =
                "REAR CAMERA";

        }

    }

}



/* ==========================================
   CAPTURE FACE
========================================== */

async function captureFaceFunction() {

    if (!modelsLoaded) {

        result.textContent =
            "Facial recognition model is not ready.";

        return;

    }


    if (!stream) {

        result.textContent =
            "Please start the camera first.";

        return;

    }


    if (
        faceDescriptors.length >= 5
    ) {

        result.textContent =
            "All 5 face samples have already been captured.";

        return;

    }


    result.textContent =
        "Detecting face...";


    try {

        const detection =
            await faceapi
                .detectSingleFace(

                    video,

                    new faceapi.TinyFaceDetectorOptions({

                        inputSize:
                            320,

                        scoreThreshold:
                            0.5

                    })

                )
                .withFaceLandmarks()
                .withFaceDescriptor();


        /*
         * NO FACE
         */

        if (!detection) {

            result.innerHTML =
                '<span class="warning">' +
                '⚠ No face detected. Please position the student clearly in front of the camera.' +
                '</span>';

            return;

        }


        /*
         * FACE SIZE
         */

        const box =
            detection.detection.box;


        if (
            box.width < 100 ||
            box.height < 100
        ) {

            result.innerHTML =
                '<span class="warning">' +
                '⚠ Move closer to the camera.' +
                '</span>';

            return;

        }


        /*
         * SAVE DESCRIPTOR
         */

        faceDescriptors.push(

            Array.from(
                detection.descriptor
            )

        );


        /*
         * UPDATE PROGRESS
         */

        updateSampleProgress();


        /*
         * DRAW DETECTION
         */

        const displaySize = {

            width:
                video.videoWidth,

            height:
                video.videoHeight

        };


        canvas.width =
            displaySize.width;


        canvas.height =
            displaySize.height;


        const resized =
            faceapi.resizeResults(

                detection,

                displaySize

            );


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.clearRect(

            0,
            0,

            canvas.width,
            canvas.height

        );


        faceapi.draw.drawDetections(

            canvas,

            resized

        );


        /*
         * NEXT INSTRUCTION
         */

        if (
            faceDescriptors.length < 5
        ) {

            result.innerHTML =

                '<span class="success">' +

                '✓ Sample ' +

                faceDescriptors.length +

                ' captured.' +

                '</span>' +

                '<br><br>' +

                getNextInstruction();

        }


        else {

            result.innerHTML =

                '<span class="success">' +

                '✓ ALL 5 FACE SAMPLES CAPTURED.' +

                '</span>' +

                '<br><br>' +

                'The student facial profile is ready.';


            saveStudent.disabled =
                false;


            captureFace.disabled =
                true;

        }

    }


    catch(error) {

        console.error(error);


        result.innerHTML =
            '<span class="error">' +
            'Face capture failed.' +
            '</span>';

    }

}



/* ==========================================
   SAMPLE PROGRESS
========================================== */

function updateSampleProgress() {

    const progress =
        document.getElementById(
            "sampleProgress"
        );


    progress.innerHTML =

        "Face Samples: " +

        "<strong>" +

        faceDescriptors.length +

        " / 5" +

        "</strong>";

}



/* ==========================================
   NEXT INSTRUCTION
========================================== */

function getNextInstruction() {

    const count =
        faceDescriptors.length;


    if (
        count === 1
    ) {

        return
            "Sample 2: Turn your face slightly LEFT.";

    }


    if (
        count === 2
    ) {

        return
            "Sample 3: Turn your face slightly RIGHT.";

    }


    if (
        count === 3
    ) {

        return
            "Sample 4: Look slightly UP.";

    }


    if (
        count === 4
    ) {

        return
            "Sample 5: Look slightly DOWN.";

    }


    return "";

}



/* ==========================================
   GOOGLE SHEETS API
========================================== */

async function sendStudentToGoogleSheets(
    student
) {

    try {

        /*
         * MAKE SURE URL EXISTS
         */

        if (
            !API_URL ||
            API_URL.includes(
                "PASTE_YOUR"
            )
        ) {

            return {

                success:
                    false,

                message:
                    "Google Apps Script Web App URL has not been configured."

            };

        }


        /*
         * SEND DATA
         */

        const response =
            await fetch(

                API_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "registerStudent",

                            lrn:
                                student.lrn,

                            name:
                                student.name,

                            grade:
                                student.grade,

                            section:
                                student.section,

                            faceDescriptors:
                                student.faceDescriptors

                        })

                }

            );


        /*
         * CHECK RESPONSE
         */

        if (
            !response.ok
        ) {

            throw new Error(

                "Server returned HTTP " +
                response.status

            );

        }


        const data =
            await response.json();


        console.log(
            "Apps Script response:",
            data
        );


        return data;

    }


    catch(error) {

        console.error(
            "Google Sheets API error:",
            error
        );


        return {

            success:
                false,

            message:
                "Unable to connect to Google Sheets. " +
                error.message

        };

    }

}



/* ==========================================
   SAVE STUDENT
========================================== */

async function saveStudentFunction() {


    /*
     * GET FORM VALUES
     */

    const lrn =
        document
            .getElementById(
                "lrn"
            )
            .value
            .trim();


    const name =
        document
            .getElementById(
                "name"
            )
            .value
            .trim();


    const grade =
        document
            .getElementById(
                "grade"
            )
            .value
            .trim();


    const section =
        document
            .getElementById(
                "section"
            )
            .value
            .trim();



    /*
     * VALIDATION
     */

    if (!lrn) {

        alert(
            "Please enter the LRN."
        );

        return;

    }


    if (!name) {

        alert(
            "Please enter the student's name."
        );

        return;

    }


    if (!grade) {

        alert(
            "Please enter the grade."
        );

        return;

    }


    if (!section) {

        alert(
            "Please enter the section."
        );

        return;

    }


    if (
        faceDescriptors.length < 5
    ) {

        alert(
            "Please capture all 5 face samples first."
        );

        return;

    }



    /*
     * CREATE STUDENT
     */

    const student = {

        lrn:
            lrn,

        name:
            name,

        grade:
            grade,

        section:
            section,

        faceDescriptors:
            faceDescriptors

    };



    /*
     * DISABLE BUTTON
     */

    saveStudent.disabled =
        true;


    result.innerHTML =
        "⏳ Saving student to Google Sheets...";



    /*
     * SEND TO APPS SCRIPT
     */

    const sheetsResult =
        await sendStudentToGoogleSheets(
            student
        );



    /*
     * FAILED
     */

    if (
        !sheetsResult.success
    ) {

        saveStudent.disabled =
            false;


        if (
            sheetsResult.duplicate
        ) {

            result.innerHTML =

                '<span class="warning">' +

                '⚠ ' +

                sheetsResult.message +

                '</span>';

        }

        else {

            result.innerHTML =

                '<span class="error">' +

                '❌ ' +

                sheetsResult.message +

                '</span>';

        }


        return;

    }



    /*
     * SUCCESS
     */

    result.innerHTML =

        '<span class="success">' +

        '✓ STUDENT REGISTERED SUCCESSFULLY' +

        '</span>' +

        '<br><br>' +

        name;



    /*
     * RESET
     */

    saveStudent.disabled =
        true;


    faceDescriptors =
        [];


    updateSampleProgress();


    /*
     * CLEAR FORM
     */

    document
        .getElementById(
            "lrn"
        )
        .value = "";


    document
        .getElementById(
            "name"
        )
        .value = "";


    document
        .getElementById(
            "grade"
        )
        .value = "";


    document
        .getElementById(
            "section"
        )
        .value = "";


    /*
     * CLEAR FACE BOX
     */

    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );

}



/* ==========================================
   EVENTS
========================================== */

startCamera.addEventListener(

    "click",

    startCameraFunction

);


captureFace.addEventListener(

    "click",

    captureFaceFunction

);


saveStudent.addEventListener(

    "click",

    saveStudentFunction

);


document
    .getElementById(
        "switchCamera"
    )
    .addEventListener(

        "click",

        switchCameraFunction

    );



/* ==========================================
   LOAD MODELS
========================================== */

loadModels();


</script>


</body>

</html>
```
