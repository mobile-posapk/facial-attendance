<body>


<header>

    <h1>
        STUDENT FACE REGISTRATION
    </h1>

    <p>
        REGISTER STUDENT FACIAL ID
    </p>

</header>


<div class="container">


<!-- ==========================================
     STUDENT INFORMATION
========================================== -->

<div class="card">

    <h2>
        Student Information
    </h2>


    <div class="form-group">

        </label>

        >

    </div>

        <label>

        </label>

        <input
            id="grade"
            type="text"
            autocomplete="off"
            placeholder="Example: 9"
        >

    </div>


    <div class="form-group">

        <label>
            SECTION
        </label>

        <input
            id="section"
            type="text"
            autocomplete="off"
            placeholder="Example: Rizal"
        >

    </div>

</div>



<!-- ==========================================
     CAMERA
========================================== -->

<div class="card">

    <h2>
        Face Capture
    </h2>


    <div class="camera">

        <video
            id="video"
            autoplay
            muted
            playsinline
        ></video>


        <canvas
            id="canvas"
        ></canvas>


        <div
            id="cameraStatus"
            class="camera-status"
        >
            CAMERA OFF
        </div>

    </div>


    <div class="controls">


        <button
            id="startCamera"
        >
            ▶ START CAMERA
        </button>


        <button
            id="captureFace"
            disabled
        >
            📸 CAPTURE SAMPLE
        </button>


        <button
            id="switchCamera"
        >
            🔄 SWITCH CAMERA
        </button>


    </div>


    <div
        id="result"
        class="result"
    >
        Waiting for camera...
    </div>


    <div
        id="sampleProgress"
        class="result"
    >

        Face Samples:
        <strong>0 / 5</strong>

    </div>

</div>



<!-- ==========================================
     SAVE
========================================== -->

<div class="card">

    <button
        id="saveStudent"
        disabled
    >
        💾 SAVE STUDENT
    </button>

</div>


</div>



<script>


/* ==========================================
   GOOGLE APPS SCRIPT API
========================================== */


/*
 * IMPORTANT:
 *
 * Replace the URL below with your
 * deployed Google Apps Script Web App URL.
 *
 * Example:
 *
 * https://script.google.com/macros/s/XXXXXXXX/exec
 */

const API_URL =
    "https://script.google.com/macros/s/AKfycbwZfRqoHRzdQrRbISRQFtBLtIiYg-E82_bzgL1oAY2oMjAKjHTMYcnU0Z5t_YVje9-2Cw/exec";



/* ==========================================
   VARIABLES
========================================== */

let stream = null;


let faceDescriptors = [];


let modelsLoaded = false;


/*
 * Front camera is the default.
 */

let facingMode = "user";



/* ==========================================
   ELEMENTS
========================================== */

const video =
    document.getElementById(
        "video"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const cameraStatus =
    document.getElementById(
        "cameraStatus"
    );


const result =
    document.getElementById(
        "result"
    );


const startCamera =
    document.getElementById(
        "startCamera"
    );


const captureFace =
    document.getElementById(
        "captureFace"
    );


const saveStudent =
    document.getElementById(
        "saveStudent"
    );



/* ==========================================
   LOAD FACE MODELS
========================================== */

async function loadModels() {

    result.textContent =
        "Loading facial recognition models...";


    try {

        const MODEL_URL =
            "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";


        await faceapi
            .nets
            .tinyFaceDetector
            .loadFromUri(
                MODEL_URL
            );


        await faceapi
            .nets
            .faceLandmark68Net
            .loadFromUri(
                MODEL_URL
            );


        await faceapi
            .nets
            .faceRecognitionNet
            .loadFromUri(
                MODEL_URL
            );


        modelsLoaded =
            true;


        result.innerHTML =
            '<span class="success">' +
            '✓ Facial recognition model ready.' +
            '</span>';

    }


    catch(error) {

        console.error(error);


        result.innerHTML =
            '<span class="error">' +
            'Unable to load facial recognition model.' +
            '</span>';

    }

}



/* ==========================================
   START CAMERA
========================================== */

async function startCameraFunction() {

    try {

        if (!modelsLoaded) {

            result.textContent =
                "Please wait for the recognition model to load.";

            return;

        }


        /*
         * Stop current camera
         */

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        result.textContent =
            "Starting camera...";


        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode: {

                            ideal:
                                facingMode

                        },

                        width: {

                            ideal:
                                1280

                        },

                        height: {

                            ideal:
                                720

                        }

                    },

                    audio:
                        false

                });


        video.srcObject =
            stream;


        await video.play();


        /*
         * Camera status
         */

        if (
            facingMode === "user"
        ) {

            cameraStatus.textContent =
                "FRONT CAMERA";

        }

        else {

            cameraStatus.textContent =
                "REAR CAMERA";

        }


        captureFace.disabled =
            false;


        result.textContent =
            "Position the student's face inside the camera.";

    }


    catch(error) {

        console.error(error);


        cameraStatus.textContent =
            "CAMERA ERROR";


        result.innerHTML =
            '<span class="error">' +
            error.name +
            ': ' +
            error.message +
            '</span>';

    }

}



/* ==========================================
   SWITCH CAMERA
========================================== */

async function switchCameraFunction() {

    if (
        facingMode === "user"
    ) {

        facingMode =
            "environment";

    }

    else {

        facingMode =
            "user";

    }


    if (stream) {

        await startCameraFunction();

    }

    else {

        if (
            facingMode === "user"
        ) {

            cameraStatus.textContent =
                "FRONT CAMERA";

        }

        else {

            cameraStatus.textContent =
                "REAR CAMERA";

        }

    }

}



/* ==========================================
   CAPTURE FACE SAMPLE
========================================== */

async function captureFaceFunction() {

    if (!modelsLoaded) {

        result.textContent =
            "Facial recognition model is not ready.";

        return;

    }


    if (!stream) {

        result.textContent =
            "Please start the camera first.";

        return;

    }


    if (
        faceDescriptors.length >= 5
    ) {

        result.textContent =
            "All 5 face samples have already been captured.";

        return;

    }


    result.textContent =
        "Detecting face...";


    try {

        const detection =
            await faceapi
                .detectSingleFace(

                    video,

                    new faceapi
                        .TinyFaceDetectorOptions({

                            inputSize:
                                320,

                            scoreThreshold:
                                0.5

                        })

                )
                .withFaceLandmarks()
                .withFaceDescriptor();


        /*
         * No face
         */

        if (!detection) {

            result.innerHTML =
                '<span class="warning">' +
                '⚠ No face detected. Please position the student clearly in front of the camera.' +
                '</span>';

            return;

        }


        /*
         * Face size check
         */

        const box =
            detection
                .detection
                .box;


        if (
            box.width < 100 ||
            box.height < 100
        ) {

            result.innerHTML =
                '<span class="warning">' +
                '⚠ Move closer to the camera.' +
                '</span>';

            return;

        }


        /*
         * SAVE DESCRIPTOR
         */

        faceDescriptors.push(

            Array.from(
                detection.descriptor
            )

        );


        /*
         * UPDATE PROGRESS
         */

        updateSampleProgress();


        /*
         * DRAW FACE DETECTION
         */

        const displaySize = {

            width:
                video.videoWidth,

            height:
                video.videoHeight

        };


        canvas.width =
            displaySize.width;


        canvas.height =
            displaySize.height;


        const resized =
            faceapi.resizeResults(

                detection,

                displaySize

            );


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.clearRect(

            0,
            0,

            canvas.width,
            canvas.height

        );


        faceapi.draw.drawDetections(

            canvas,

            resized

        );


        /*
         * NEXT INSTRUCTION
         */

        if (
            faceDescriptors.length < 5
        ) {

            result.innerHTML =
                '<span class="success">' +

                '✓ Sample ' +

                faceDescriptors.length +

                ' captured.' +

                '</span>' +

                '<br><br>' +

                getNextInstruction();

        }


        else {

            result.innerHTML =
                '<span class="success">' +

                '✓ ALL 5 FACE SAMPLES CAPTURED.' +

                '</span>' +

                '<br><br>' +

                'The student facial profile is ready.';


            saveStudent.disabled =
                false;


            captureFace.disabled =
                true;

        }

    }


    catch(error) {

        console.error(error);


        result.innerHTML =
            '<span class="error">' +
            'Face capture failed.' +
            '</span>';

    }

}



/* ==========================================
   SAMPLE PROGRESS
========================================== */

function updateSampleProgress() {

    const progress =
        document.getElementById(
            "sampleProgress"
        );


    progress.innerHTML =
        "Face Samples: " +

        "<strong>" +

        faceDescriptors.length +

        " / 5" +

        "</strong>";

}



/* ==========================================
   NEXT SAMPLE INSTRUCTION
========================================== */

function getNextInstruction() {

    const count =
        faceDescriptors.length;


    if (
        count === 1
    ) {

        return
            "Sample 2: Turn your face slightly LEFT.";

    }


    if (
        count === 2
    ) {

        return
            "Sample 3: Turn your face slightly RIGHT.";

    }


    if (
        count === 3
    ) {

        return
            "Sample 4: Look slightly UP.";

    }


    if (
        count === 4
    ) {

        return
            "Sample 5: Look slightly DOWN.";

    }


    return "";

}



/* ==========================================
   SEND STUDENT TO GOOGLE SHEETS
========================================== */

async function sendStudentToGoogleSheets(
    student
) {

    try {

        /*
         * Check API URL
         */

        if (
            !API_URL ||
            API_URL.includes(
                "PASTE_YOUR"
            )
        ) {

            return {

                success:
                    false,

                message:
                    "Google Apps Script API URL has not been configured."

            };

        }


        /*
         * Send request
         */

        const response =
            await fetch(

                API_URL,

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "registerStudent",

                            lrn:
                                student.lrn,

                            name:
                                student.name,

                            grade:
                                student.grade,

                            section:
                                student.section,

                            faceDescriptors:
                                student.faceDescriptors

                        })

                }

            );


        /*
         * Check HTTP response
         */

        if (
            !response.ok
        ) {

            throw new Error(
                "Server returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Google Apps Script response:",
            data
        );


        return data;

    }


    catch(error) {

        console.error(
            "Google Sheets API error:",
            error
        );


        return {

            success:
                false,

            message:
                "Unable to connect to Google Sheets. " +
                error.message

        };

    }

}



/* ==========================================
   SAVE STUDENT
========================================== */

async function saveStudentFunction() {

    /*
     * GET INFORMATION
     */

    const lrn =
        document
            .getElementById(
                "lrn"
            )
            .value
            .trim();


    const name =
        document
            .getElementById(
                "name"
            )
            .value
            .trim();


    const grade =
        document
            .getElementById(
                "grade"
            )
            .value
            .trim();


    const section =
        document
            .getElementById(
                "section"
            )
            .value
            .trim();



    /*
     * VALIDATION
     */

    if (!lrn) {

        alert(
            "Please enter the LRN."
        );

        return;

    }


    if (!name) {

        alert(
            "Please enter the student's name."
        );

        return;

    }


    if (!grade) {

        alert(
            "Please enter the grade."
        );

        return;

    }


    if (!section) {

        alert(
            "Please enter the section."
        );

        return;

    }


    if (
        faceDescriptors.length < 5
    ) {

        alert(
            "Please capture all 5 face samples first."
        );

        return;

    }



    /*
     * CREATE STUDENT OBJECT
     */

    const student = {

        lrn:
            lrn,

        name:
            name,

        grade:
            grade,

        section:
            section,

        faceDescriptors:
            faceDescriptors,

        createdAt:
            new Date().toISOString()

    };



    /*
     * DISABLE SAVE WHILE SENDING
     */

    saveStudent.disabled =
        true;


    result.innerHTML =
        "⏳ Saving student to Google Sheets...";



    /*
     * SEND TO GOOGLE APPS SCRIPT
     */

    const sheetsResult =
        await sendStudentToGoogleSheets(
            student
        );



    /*
     * HANDLE ERROR
     */

    if (
        !sheetsResult.success
    ) {

        saveStudent.disabled =
            false;


        if (
            sheetsResult.duplicate
        ) {

            result.innerHTML =
                '<span class="warning">' +
                '⚠ ' +
                sheetsResult.message +
                '</span>';

        }

        else {

            result.innerHTML =
                '<span class="error">' +
                '❌ ' +
                sheetsResult.message +
                '</span>';

        }


        return;

    }



    /*
     * SUCCESS
     */

    result.innerHTML =
        '<span class="success">' +
        '✓ STUDENT REGISTERED SUCCESSFULLY' +
        '</span>' +

        '<br><br>' +

        name;



    /*
     * RESET
     */

    saveStudent.disabled =
        true;


    faceDescriptors =
        [];


    updateSampleProgress();


    /*
     * CLEAR FORM
     */

    document
        .getElementById(
            "lrn"
        )
        .value = "";


    document
        .getElementById(
            "name"
        )
        .value = "";


    document
        .getElementById(
            "grade"
        )
        .value = "";


    document
        .getElementById(
            "section"
        )
        .value = "";


    /*
     * CLEAR FACE BOX
     */

    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );

}



/* ==========================================
   EVENTS
========================================== */

startCamera.addEventListener(

    "click",

    startCameraFunction

);


captureFace.addEventListener(

    "click",

    captureFaceFunction

);


saveStudent.addEventListener(

    "click",

    saveStudentFunction

);


document
    .getElementById(
        "switchCamera"
    )
    .addEventListener(

        "click",

        switchCameraFunction

    );



/* ==========================================
   LOAD MODELS
========================================== */

loadModels();


</script>


</body>

</html>
